services:
  mysql:
    build: .
    container_name: gymfit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "Root2026*"
      TZ: America/Lima
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_spanish_ci
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pRoot2026*"]
      interval: 5s
      timeout: 3s
      retries: 20